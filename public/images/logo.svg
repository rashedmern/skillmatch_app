<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <!-- Brand Icon Badge -->
  <rect x="2" y="6" width="52" height="52" rx="14" fill="#095964"/>
  <rect x="2" y="6" width="52" height="52" rx="14" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Interconnected CSE Skill Network Nodes -->
  <g transform="translate(14, 18)">
    <line x1="14" y1="14" x2="14" y2="4" stroke="#00d4be" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="23.5" y2="10" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="20" y2="23" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="8" y2="23" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="4.5" y2="10" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    
    <circle cx="14" cy="4" r="3.2" fill="#ffffff"/>
    <circle cx="23.5" cy="10" r="3.2" fill="#00d4be"/>
    <circle cx="20" cy="23" r="3.2" fill="#67e8f9"/>
    <circle cx="8" cy="23" r="3.2" fill="#67e8f9"/>
    <circle cx="4.5" cy="10" r="3.2" fill="#00d4be"/>
    
    <circle cx="14" cy="14" r="4.8" fill="#ffffff" stroke="#095964" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="2.2" fill="#095964"/>
  </g>

  <!-- Wordmark in Arimo font style -->
  <text x="68" y="41" font-family="'Arimo', -apple-system, sans-serif" font-size="27" font-weight="800" fill="#095964" letter-spacing="-0.6px">Skill<tspan fill="#0a887d" font-weight="700">Match</tspan></text>
  
  <!-- CSE Department / Ecosystem Badge Pill -->
  <g transform="translate(230, 20)">
    <rect x="0" y="0" width="54" height="24" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="27" y="16" font-family="'Arimo', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="0.5px">CSE</text>
  </g>
</svg>
