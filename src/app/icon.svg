<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- High-Precision Dark Oceanic Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004049"/>
      <stop offset="100%" stop-color="#095964"/>
    </linearGradient>
    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" stroke="rgba(255, 255, 255, 0.18)" stroke-width="10"/>

  <!-- Interconnected AST CSE Skill Graph -->
  <g transform="translate(137, 137) scale(8.5)">
    <!-- Edges / Signal Paths -->
    <line x1="14" y1="14" x2="14" y2="4" stroke="#00d4be" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="23.5" y2="10" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="20" y2="23" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="8" y2="23" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="4.5" y2="10" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Peripheral Leaf Nodes -->
    <circle cx="14" cy="4" r="3.2" fill="#ffffff"/>
    <circle cx="23.5" cy="10" r="3.2" fill="#00d4be"/>
    <circle cx="20" cy="23" r="3.2" fill="#67e8f9"/>
    <circle cx="8" cy="23" r="3.2" fill="#67e8f9"/>
    <circle cx="4.5" cy="10" r="3.2" fill="#00d4be"/>

    <!-- Central Verification Hub Node -->
    <circle cx="14" cy="14" r="5" fill="#ffffff" stroke="#095964" stroke-width="1.5" filter="url(#hubGlow)"/>
    <circle cx="14" cy="14" r="2.2" fill="#095964"/>
  </g>
</svg>
